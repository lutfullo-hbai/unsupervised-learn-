[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    integration: haqiqiy tashqi servislar (Ollama, Google Translate) bilan ishlaydi. -m "not integration" bilan chiqariladi.
    slow: uzoq davom etadigan testlar
filterwarnings =
    ignore::DeprecationWarning